# GoReleaser configuration for civitai-manager.
# Docs: https://goreleaser.com
#
# Release is intentionally simple because SQLite is the pure-Go
# modernc.org/sqlite driver, so CGO_ENABLED=0 cross-compiles cleanly for every
# target below. The web assets (Tailwind output.css, htmx.min.js) are committed
# and go:embed-ed, so no JS/CSS toolchain is needed at build time.
#
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# The release.yml workflow then runs `goreleaser release --clean`.
version: 2

project_name: civitai-manager

before:
  hooks:
    - go mod tidy

builds:
  - id: civitai-manager
    main: .
    binary: civitai-manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Inject build metadata into the package-main vars wired in main.go.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: civitai-manager
    ids:
      - civitai-manager
    # tar.gz everywhere, zip on Windows.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Native Linux packages, built from the same binaries as the tarballs. The
# `nfpm` pipe is OSS (no GoReleaser Pro needed) and requires no extra secret —
# the .deb/.rpm are just more files attached to the GitHub Release.
nfpms:
  - id: civitai-manager
    ids:
      - civitai-manager
    package_name: civitai-manager
    vendor: ZacxDev
    homepage: https://github.com/ZacxDev/civitai-manager
    maintainer: Zach Lowden <zachlowden1@gmail.com>
    description: |-
      Subscribe to CivitAI models/creators and auto-download new versions.
      Runs a ComfyUI workflow and fetches the model files it is missing,
      subscribes to CivitAI models and creators, and scans a local model
      library for duplicates and broken files. Single static binary with a
      loopback-only offline web UI and a local SQLite state file.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: LICENSE
        dst: /usr/share/doc/civitai-manager/LICENSE
      - src: README.md
        dst: /usr/share/doc/civitai-manager/README.md

# Homebrew via a personal tap. homebrew-core is not an option: its policy needs
# 75 GitHub stars (225 to self-submit) and this repo has nowhere near that.
#
# `homebrew_casks` — NOT the old `brews` — because `brews` was hard-deprecated
# in GoReleaser v2.16 and is removed in v3. Casks cover Linux as well as macOS
# (Homebrew 4.5.0 added Linux casks, 5.0.0 ARM Linux), so one cask serves both.
# Casks have no `test do` block and no bottles; `livecheck { skip ... }` is
# emitted by GoReleaser itself.
homebrew_casks:
  - name: civitai-manager
    ids:
      - civitai-manager
    homepage: https://github.com/ZacxDev/civitai-manager
    description: Subscribe to CivitAI models/creators and auto-download new versions
    license: Apache-2.0

    # KEEP THIS. It is a permanent fail-soft, not scaffolding.
    #
    # ZacxDev/homebrew-tap exists (public, `main`, `Casks/`) and the
    # HOMEBREW_TAP_GITHUB_TOKEN secret is set, so this normally evaluates to
    # `false` and the cask is published. Do not "clean it up" on the grounds
    # that the tap now exists — that is not what it guards.
    #
    # What it guards: GoReleaser resolves `skip_upload` BEFORE it expands
    # `repository.token`. Any run where the secret is missing — expired or
    # revoked PAT, a fork, a manual `goreleaser release` from a laptop — would
    # otherwise fail to expand `.Env.HOMEBREW_TAP_GITHUB_TOKEN` and take the
    # whole release down. And it would do so LATE: GoReleaser publishes the
    # GitHub Release (`release.Pipe{}`) before it runs the cask
    # (`cask.Pipe{}`), so the artifacts are already public by then. With the
    # guard, the cask is skipped, dist/homebrew/Casks/civitai-manager.rb is
    # still written for inspection, and the release stands.
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'

    repository:
      owner: ZacxDev
      name: homebrew-tap
      # A per-release branch, because the cask is delivered as a PULL REQUEST
      # rather than a direct push. A release workflow that is compromised can
      # then only propose a tap change, not silently rewrite the tap.
      branch: "{{ .ProjectName }}-{{ .Version }}"
      # Must be exactly `{{ .Env.NAME }}` — GoReleaser validates this field
      # against a single-env-var regexp to discourage inline credentials.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          branch: main

    # A DELIBERATE GATEKEEPER BYPASS. Read this before changing it.
    #
    # These binaries are not notarized (notarization needs an Apple Developer
    # Program membership and, for GoReleaser, the Pro-only `notarize` pipe), so
    # without this hook a macOS `brew install --cask` produces a binary that is
    # KILLED on first run. Evidence, not guesswork:
    #
    #  * Homebrew quarantines the STAGED file, whatever the artifact type.
    #    `Cask::Download#extract_primary_container` ends with
    #    `Quarantine.propagate(from: container.path, to:)` (cask/download.rb),
    #    the installer passes `to: @cask.staged_path` (cask/installer.rb), and
    #    `Quarantine.propagate` globs `to/**/*` and writes
    #    com.apple.quarantine to every non-symlink under it (cask/quarantine.rb).
    #    Nothing there branches on `app`/`pkg`/`binary`. cask/artifact/binary.rb
    #    only symlinks + chmods, so `$(brew --prefix)/bin/civitai-manager`
    #    resolves to a quarantined file.
    #  * `--no-quarantine` is GONE — deprecated in Homebrew 5.0, disabled in
    #    5.1, deleted in 5.2. Users can no longer opt out at install time.
    #  * A quarantined, non-notarized Mach-O run from Terminal is terminated by
    #    syspolicyd ("Apple could not verify … is free of malware"), not merely
    #    warned about. Reported against a Homebrew cask `binary` artifact on
    #    macOS 26.4 (microsoft/vscode#309147, 2026-04) — this exact shape.
    #  * Ad-hoc signing is NOT an alternative: `rcodesign print-signature-info`
    #    on our own dist/ output shows the darwin/arm64 binary ALREADY carries
    #    `CodeSignatureFlags(ADHOC | LINKER_SIGNED)` (Go's linker signs
    #    darwin/arm64 automatically, `NeedCodeSign` in cmd/link/internal/ld),
    #    and it is still quarantined and still blocked. Gatekeeper wants a
    #    notarization ticket, which ad-hoc cannot provide.
    #
    # So the choice is: strip the xattr, or ship an install that fails on first
    # run for every macOS user. We strip, and say so in `caveats` — Homebrew no
    # longer shows its own "--no-quarantine bypasses Gatekeeper" warning here,
    # so the disclosure has to come from us.
    #
    # The hook must not silently decline. The previous version gated on
    # `system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0`, which
    # on a Mac whose /usr/bin/xattr shells out to a missing `xcrun` fails the
    # probe and skips the strip while still reporting a successful install.
    # `File.executable?` avoids the Errno::ENOENT that would abort the install,
    # and `must_succeed: false` (the cask DSL's `system_command` is `run!`, i.e.
    # raising, by default) keeps a failed strip from taking the install down
    # while `print_stderr` still surfaces why it failed.
    #
    # If this ever stops working — Apple can withdraw the bypass — the fix is
    # Developer ID signing + notarization + a STAPLED .pkg/.dmg. Notarizing the
    # bare binary is not enough: a ticket cannot be stapled to a bare Mach-O.
    caveats: |
      The release binaries are not notarized by Apple, so macOS would refuse to
      run this one after Homebrew quarantines it. This cask therefore removes the
      com.apple.quarantine attribute from the files it installed — the same thing
      `brew install --no-quarantine` used to do, before Homebrew removed that flag.

      Only the files from this cask are affected. If you would rather not have
      that happen, install from a release tarball instead:
      https://github.com/ZacxDev/civitai-manager/blob/main/docs/install.md

    hooks:
      post:
        install: |
          if OS.mac? && File.executable?("/usr/bin/xattr")
            system_command "/usr/bin/xattr",
                           args:         ["-dr", "com.apple.quarantine", staged_path],
                           must_succeed: false
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  # GitHub Releases (the default publisher) is the target. No external repo or
  # extra secret is required — release.yml passes the built-in GITHUB_TOKEN.
  draft: false
  prerelease: auto
