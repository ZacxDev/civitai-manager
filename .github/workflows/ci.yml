name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt (fail on unformatted files)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # docs/install.sh is fed to `sh` off the internet, so it is linted as
      # POSIX sh (not bash) on every change. shellcheck ships on the runner.
      - name: shellcheck (docs/install.sh)
        run: shellcheck --shell=sh docs/install.sh

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test -race (concurrency-sensitive packages)
        run: |
          go test -race \
            ./internal/library/... \
            ./internal/store/... \
            ./internal/queue/... \
            ./internal/poller/... \
            ./internal/web/...

      # Compile-only check of the build-tagged live integration suite. It is NOT
      # run here (no CIVITAI_TOKEN); the live run lives in integration.yml.
      - name: compile integration suite
        run: go build -tags integration ./...

  # 🔴 e2e/uxaudit is a NESTED MODULE (its own go.mod). The `test` job above runs
  # `go build/vet/test ./...` from the repo root, which does NOT reach it — so for
  # two releases the ux-audit walk was completely broken (a selector rotted after
  # the v0.1.97 run-zone rework) and CI was green the whole time. A harness that
  # never runs reports no failures.
  #
  # It gets its OWN job rather than extra steps in `test` because it declares a
  # newer Go directive (go 1.26 vs the root module's 1.25.0), and bumping the shared
  # job's toolchain to satisfy it would silently change the compiler every existing
  # root-module check runs under. (It would NOT change the shipped binary — that is
  # built by GoReleaser in release.yml, which this file does not feed. An earlier
  # version of this comment claimed otherwise.) Keeping them separate means adding
  # coverage cannot perturb a gate that already works.
  #
  # gofmt is deliberately NOT repeated here — `gofmt -l .` in the `test` job walks
  # the directory tree, not the module graph, so it already covers these files.
  uxaudit:
    name: e2e/uxaudit (nested module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: e2e/uxaudit/go.sum

      # The browser walk (TestUXAuditWalk) is double-gated and SKIPS here: it needs
      # UXAUDIT_WALK=1 plus a resolvable Chromium, and this job supplies neither.
      # What does run is the browserless rot-guard (walk_selectors_test.go), which
      # boots the hermetic lab app in-process and asserts the app still serves what
      # the walk's selectors key on. That is the part that must not rot unnoticed.
      - name: go build
        run: go build ./...
        working-directory: e2e/uxaudit

      - name: go vet
        run: go vet ./...
        working-directory: e2e/uxaudit

      - name: go test
        run: go test ./...
        working-directory: e2e/uxaudit

  # 🔴 The REACHABILITY gate. CLAUDE.md's "Reachability" section records this
  # repo's real recurring defect: not broken code, code that NEVER RUNS. A
  # deliberate sweep found 17 confirmed-dead items — 11 functions, an orphan
  # route, and a flag plumbed through five layers and read by nobody for 89
  # releases. Every one of them passed build, vet, test, -race and gofmt. This is
  # the only job that can see them.
  #
  # It runs `deadcode` under all three GOOS this repo ships and gates on the
  # INTERSECTION. That is load-bearing, not tidiness: internal/diskusage is split
  # by build tag, so fromBlocks (unix) and fromByteCounts (windows) are each dead
  # on one target and live on the other. A single-GOOS run reports whichever one
  # as a false positive.
  #
  # Its OWN job, following the `uxaudit` precedent above rather than bolting onto
  # `test`: it needs Go 1.26 (one tool binary has to load the nested module too),
  # and raising the shared job's toolchain would silently change the compiler
  # every existing root-module check runs under. Adding a gate must not perturb a
  # gate that already works.
  #
  # The tool is PINNED (see DEADCODE_VERSION in the script), never @latest — CI
  # has to be reproducible, and an analysis that changes under you changes what
  # this gate means.
  deadcode:
    name: deadcode (reachability, 3x GOOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 1.26, not 1.25: the script analyzes the root module AND the nested
      # e2e/uxaudit module (go 1.26) with a single tool binary, so the toolchain
      # must satisfy the higher directive. The script checks this itself and
      # fails with both version numbers rather than emitting 200 lines of
      # "package requires newer Go version".
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # shellcheck ships on the runner. Linted here rather than in the `test`
      # job's shellcheck step so this gate stays self-contained.
      - name: shellcheck (.github/deadcode.sh)
        run: shellcheck .github/deadcode.sh

      - name: deadcode gate
        run: .github/deadcode.sh

  # The flake's vendorHash is a fixed-output hash over the module set. Nothing
  # in the Go build path touches it, so a `go get` silently invalidates it and
  # `nix build github:ZacxDev/civitai-manager` starts failing for everyone with
  # a hash mismatch — which is exactly how it broke before. There is no linter
  # for this; building the flake in CI is the entire detection mechanism.
  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds packages + checks. Fails loudly on a stale vendorHash and prints
      # the correct replacement value in the error.
      - name: nix flake check
        run: nix flake check -L

      - name: nix run --version
        run: nix run .# -- --version
